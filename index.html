<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <title>Sensational Sabrina's Cinnamoroll Cinema</title>
    <style>
      :root {
        font-family: 'Nunito', Arial, sans-serif;
        --pink: #ffb7c5;
        --blue: #a8d8f0;
        --purple: #d4b8e8;
        --cream: #fff6f9;
        --text: #5a3a5a;
        --card-bg: #ffffff;
        --accent: #f472b6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #fce4ec 0%, #e8d5f5 50%, #d0eaf8 100%);
        color: var(--text);
      }

      /* ── Header ── */
      header {
        text-align: center;
        padding: 36px 16px 24px;
        position: relative;
      }

      .deco-strip {
        display: flex;
        justify-content: center;
        gap: 10px;
        font-size: 1.4rem;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.6rem, 5vw, 2.8rem);
        font-weight: 800;
        color: #c45c8a;
        text-shadow: 2px 2px 0 #f9a8d4, 4px 4px 0 rgba(196,92,138,0.15);
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-size: 1rem;
        color: #a06080;
        margin: 0 0 8px;
      }

      /* ── Cinnamoroll banner SVG ── */
      .banner-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin: 10px 0 4px;
        flex-wrap: wrap;
      }

      .cinnamoroll-icon {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 4px 8px rgba(180,120,180,0.25));
      }

      .banner-stars {
        font-size: 1.6rem;
        letter-spacing: 4px;
      }

      /* ── Main content ── */
      main {
        width: min(1140px, calc(100% - 24px));
        margin: 0 auto;
        padding: 0 0 56px;
      }

      .section-label {
        text-align: center;
        font-size: 1.1rem;
        font-weight: 700;
        color: #b06090;
        margin: 0 0 20px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* ── Video grid ── */
      .video-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 540px) {
        .video-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 900px) {
        .video-grid {
          grid-template-columns: minmax(260px, 380px) repeat(2, minmax(260px, 1fr));
        }
        .video.short {
          grid-row: span 2;
        }
      }

      .video {
        overflow: hidden;
        border: 2.5px solid var(--pink);
        border-radius: 20px;
        background: var(--card-bg);
        box-shadow: 0 6px 20px rgba(180, 100, 160, 0.12), 0 0 0 4px rgba(255,183,197,0.18);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .video:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(180, 100, 160, 0.2), 0 0 0 4px rgba(255,183,197,0.3);
      }

      .video iframe {
        display: block;
        width: 100%;
        border: 0;
        aspect-ratio: 16 / 9;
      }

      .video.short iframe {
        aspect-ratio: 9 / 16;
      }

      .video-label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
      }

      .video-label a {
        color: #c45c8a;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      .video-label a:hover {
        text-decoration: underline;
      }

      .paw {
        font-size: 0.85rem;
        opacity: 0.7;
      }

      /* ── Footer ── */
      footer {
        text-align: center;
        padding: 16px;
        font-size: 0.85rem;
        color: #b090b0;
      }
    </style>
  </head>

          <ellipse cx="37" cy="14" rx="2.5" ry="1.5" fill="white" opacity="0.85"/>
        </svg>
      </div>

      <div class="deco-strip" style="margin-top:10px;">
        <span>🩷</span><span>🌟</span><span>🩵</span><span>⭐</span><span>🌸</span><span>💫</span><span>🩷</span>
      </div>
    </header>
