<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer roll body -->
  <circle cx="32" cy="32" r="30" fill="#c8843a"/>
  <!-- Swirl ring 1 -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#9e5a1a" stroke-width="5"/>
  <!-- Swirl ring 2 -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#9e5a1a" stroke-width="4"/>
  <!-- Swirl ring 3 -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#9e5a1a" stroke-width="3"/>
  <!-- Center -->
  <circle cx="32" cy="32" r="3" fill="#9e5a1a"/>
  <!-- Icing drips -->
  <ellipse cx="32" cy="32" rx="14" ry="14" fill="white" opacity="0.85"/>
  <ellipse cx="32" cy="32" rx="9" ry="9" fill="white" opacity="0.9"/>
  <!-- Icing blobs on outer edge -->
  <ellipse cx="32" cy="7" rx="6" ry="4" fill="white" opacity="0.9"/>
  <ellipse cx="50" cy="17" rx="5" ry="3.5" fill="white" opacity="0.9"/>
  <ellipse cx="55" cy="38" rx="4.5" ry="3" fill="white" opacity="0.85"/>
  <ellipse cx="14" cy="48" rx="5" ry="3.5" fill="white" opacity="0.9"/>
  <ellipse cx="10" cy="25" rx="4" ry="3" fill="white" opacity="0.85"/>
</svg>
