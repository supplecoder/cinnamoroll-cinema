<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Left ear -->
  <ellipse cx="14" cy="34" rx="8" ry="20" fill="#a8cce8" transform="rotate(-15 14 34)"/>
  <!-- Right ear -->
  <ellipse cx="50" cy="34" rx="8" ry="20" fill="#a8cce8" transform="rotate(15 50 34)"/>
  <!-- Inner left ear -->
  <ellipse cx="14" cy="34" rx="5" ry="14" fill="#c8e4f5" transform="rotate(-15 14 34)"/>
  <!-- Inner right ear -->
  <ellipse cx="50" cy="34" rx="5" ry="14" fill="#c8e4f5" transform="rotate(15 50 34)"/>

  <!-- Head -->
  <circle cx="32" cy="36" r="24" fill="white"/>
  <circle cx="32" cy="36" r="24" fill="none" stroke="#d8d8d8" stroke-width="0.5"/>

  <!-- Left eye -->
  <ellipse cx="23" cy="33" rx="5" ry="5.5" fill="#4a90d0"/>
  <ellipse cx="23" cy="33" rx="3" ry="3.5" fill="#1a5a9a"/>
  <circle cx="24.5" cy="31" r="1.5" fill="white"/>

  <!-- Right eye -->
  <ellipse cx="41" cy="33" rx="5" ry="5.5" fill="#4a90d0"/>
  <ellipse cx="41" cy="33" rx="3" ry="3.5" fill="#1a5a9a"/>
  <circle cx="42.5" cy="31" r="1.5" fill="white"/>

  <!-- Nose -->
  <ellipse cx="32" cy="41" rx="3" ry="2" fill="#f4a0b0"/>

  <!-- Cheeks -->
  <ellipse cx="17" cy="43" rx="5" ry="3" fill="#f9c0c8" opacity="0.6"/>
  <ellipse cx="47" cy="43" rx="5" ry="3" fill="#f9c0c8" opacity="0.6"/>

  <!-- Cinnamon roll on top of head -->
  <circle cx="32" cy="14" r="8" fill="#c8843a"/>
  <circle cx="32" cy="14" r="5" fill="none" stroke="#9e5a1a" stroke-width="2"/>
  <circle cx="32" cy="14" r="2" fill="#9e5a1a"/>
  <!-- Icing on the roll -->
  <ellipse cx="32" cy="10" rx="4" ry="2.5" fill="white" opacity="0.9"/>
  <ellipse cx="37" cy="14" rx="2.5" ry="1.5" fill="white" opacity="0.85"/>
</svg>
