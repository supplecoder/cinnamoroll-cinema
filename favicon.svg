<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Light blue background circle -->
  <circle cx="32" cy="34" r="28" fill="#c8e8f8"/>

  <!-- Left floppy ear -->
  <ellipse cx="13" cy="36" rx="10" ry="7" fill="white" stroke="#333" stroke-width="1.2" transform="rotate(-30 13 36)"/>
  <!-- Right floppy ear -->
  <ellipse cx="51" cy="36" rx="10" ry="7" fill="white" stroke="#333" stroke-width="1.2" transform="rotate(30 51 36)"/>

  <!-- Head -->
  <ellipse cx="32" cy="30" rx="20" ry="19" fill="white" stroke="#333" stroke-width="1.3"/>

  <!-- Left eye (blue oval) -->
  <ellipse cx="24" cy="27" rx="3.5" ry="4.5" fill="#5ab4e0"/>
  <ellipse cx="24" cy="28" rx="2" ry="2.5" fill="#2a7ab0"/>
  <circle cx="25" cy="26" r="1" fill="white"/>

  <!-- Right eye (happy squint / curved line) -->
  <path d="M 37 25 Q 40 23 43 25" stroke="#5ab4e0" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Pink cheeks -->
  <ellipse cx="18" cy="33" rx="5.5" ry="3.5" fill="#f4a0b8" opacity="0.7"/>
  <ellipse cx="46" cy="33" rx="5.5" ry="3.5" fill="#f4a0b8" opacity="0.7"/>

  <!-- Mouth with tongue -->
  <path d="M 27 36 Q 32 40 37 36" stroke="#333" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="32" cy="38" rx="3" ry="2" fill="#f4a0b8"/>

  <!-- Curly tail (top right) -->
  <path d="M 46 12 Q 54 8 54 16 Q 54 22 48 20" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
